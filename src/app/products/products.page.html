<ion-header>
  <ion-toolbar>
    <ion-title>Productos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>${{ product.price }}</p>
      </ion-label>
      <ion-button (click)="updateProduct(product.key, product)">Editar</ion-button>
      <ion-button color="danger" (click)="deleteProduct(product.key)">Eliminar</ion-button>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="addProduct(newProduct)">Agregar Producto</ion-button>
</ion-content>

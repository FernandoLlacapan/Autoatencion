<ion-header>
  <ion-toolbar>
    <ion-title>Error de Inicio de Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Mensaje de error -->
  <div class="error-message">
    <h2>Inicio de sesión incorrecto</h2>
    <p>Lo sentimos, el inicio de sesión ha fallado. Por favor, verifica tus credenciales e intenta de nuevo.</p>
  </div>

  <!-- Botón para regresar al inicio de sesión -->
  <ion-button expand="block" color="primary" (click)="goToLogin()">Volver al inicio de sesión</ion-button>
</ion-content>

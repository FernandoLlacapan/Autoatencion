<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>categories</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let category of categories">
      <ion-thumbnail slot="start">
        <img [src]="category.image" alt="{{ category.name }}">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ category.name }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>

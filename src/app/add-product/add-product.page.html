<form (ngSubmit)="addProduct()">
  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input [(ngModel)]="product.name" name="name"></ion-input>
  </ion-item>
  
  <ion-item>
    <ion-label position="floating">Precio</ion-label>
    <ion-input type="number" [(ngModel)]="product.price" name="price"></ion-input>
  </ion-item>
  
  <ion-item>
    <ion-label position="floating">Cantidad</ion-label>
    <ion-input type="number" [(ngModel)]="product.quantity" name="quantity"></ion-input>
  </ion-item>

  <ion-item *ngIf="product.photo">
    <img [src]="product.photo" alt="Vista previa de la foto" style="width: 100%; height: auto;">
  </ion-item>

  <ion-button expand="full" color="secondary" (click)="capturePhoto()">Sacar Foto</ion-button>
  <ion-button expand="full" type="submit" color="primary">Agregar Producto</ion-button>
</form>

<ion-header>
  <ion-toolbar>
    <ion-title>Bienvenido</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h1>Bienvenido a la aplicación</h1>
</ion-content>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let category of categories" (click)="navigateToCategory(category.route)">
      <ion-label>{{ category.name }}</ion-label>
    </ion-item>
    <ion-buttons slot="end">
      <ion-item *ngIf="isAdmin()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        <ion-label>Agregar Producto</ion-label>
      </ion-item>
    </ion-buttons>
    <ion-buttons slot="start">
      <ion-button (click)="goToCart()">
        <ion-icon name="cart-outline"></ion-icon> Carrito
      </ion-button>
    </ion-buttons>
  </ion-list>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>Productos</ion-title>
    <ion-buttons slot="end">
      <ion-item *ngIf="isAdmin()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        <ion-label>Agregar Producto</ion-label>
      </ion-item>
    </ion-buttons>
    <ion-buttons slot="start">
      <ion-button (click)="goToCart()">
        <ion-icon name="cart-outline"></ion-icon> Carrito
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

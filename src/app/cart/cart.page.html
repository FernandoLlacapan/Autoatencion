<ion-header>
  <ion-toolbar>
    <ion-title>Carrito de Compras</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let product of cartProducts">
      <ion-thumbnail slot="start">
        <img [src]="product.image" alt="{{ product.name }}">
      </ion-thumbnail>
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>Precio: ${{ product.price }} x {{ product.quantity }}</p>
        <p>Total: ${{ product.price * product.quantity }}</p>
      </ion-label>
      <ion-button color="danger" (click)="removeFromCart(product)">Eliminar</ion-button>
    </ion-item>
  </ion-list>
  <ion-item>
    <ion-label>Total del Carrito</ion-label>
    <ion-note slot="end">${{ total }}</ion-note>
  </ion-item>
  <ion-button expand="full" color="success" (click)="proceedToPayment()">Pagar</ion-button>

  
</ion-content>
